set_picture_mode:
  name: Set picture mode
  description: Set the XGIMI picture mode through the installed Android bridge APK.
  target:
    entity:
      domain: media_player
  fields:
    mode:
      selector:
        select:
          options:
            - bright
            - standard
            - soft
            - user
            - game
            - auto
            - pc
            - movie
            - natural
            - sports
    value:
      selector:
        number:
          min: 0
          max: 99
          mode: box
    source:
      selector:
        number:
          min: 0
          max: 99
          mode: box

set_memc:
  name: Set MEMC
  description: Set the XGIMI MEMC level through the installed Android bridge APK.
  target:
    entity:
      domain: media_player
  fields:
    level:
      selector:
        select:
          options:
            - "off"
            - "low"
            - "middle"
            - "high"
            - "bypass"
    value:
      selector:
        number:
          min: 0
          max: 99
          mode: box
    source:
      selector:
        number:
          min: 0
          max: 99
          mode: box

get_status:
  name: Get status
  description: Ask the Android bridge APK to log the current XGIMI picture mode and MEMC state.
  target:
    entity:
      domain: media_player
  fields:
    source:
      selector:
        number:
          min: 0
          max: 99
          mode: box

get_native_pq_status:
  name: Get native PQ status
  description: Read the native MediaTek PQ status JSON through Android service call.
  target:
    entity:
      domain: media_player

get_native_hdr_type:
  name: Get native HDR type
  description: Read the native MediaTek PQ HDR type through Android service call.
  target:
    entity:
      domain: media_player

set_native_pq_value:
  name: Set native PQ value
  description: Read the current native MediaTek PQ JSON, change one key, and write the full JSON back.
  target:
    entity:
      domain: media_player
  fields:
    key:
      required: true
      selector:
        text:
    value:
      required: true
      selector:
        text:

get_ext_pq_status:
  name: Get ExtService PQ status
  description: Read MediaTek PQ status through the bridge APK and the OSD-adjacent ExtService path.
  target:
    entity:
      domain: media_player

autofocus:
  name: Autofocus
  description: Start the confirmed native XGIMI autofocus Binder call.
  target:
    entity:
      domain: media_player

open_picture_mode_osd:
  name: Open Picture Mode OSD
  description: Open the projector's original Google TV / MediaTek Picture Mode screen.
  target:
    entity:
      domain: media_player

osd_picture_mode_previous:
  name: OSD Picture Mode Previous
  description: Move one step left in the open Picture Mode OSD.
  target:
    entity:
      domain: media_player

osd_picture_mode_next:
  name: OSD Picture Mode Next
  description: Move one step right in the open Picture Mode OSD.
  target:
    entity:
      domain: media_player

osd_confirm:
  name: OSD Confirm
  description: Send DPAD center / OK to the projector OSD.
  target:
    entity:
      domain: media_player

osd_back:
  name: OSD Back
  description: Send Back to close or step out of the projector OSD.
  target:
    entity:
      domain: media_player
