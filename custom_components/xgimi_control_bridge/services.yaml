set_picture_mode:
  name: Set picture mode
  description: Set the XGIMI picture mode through the installed Android bridge APK.
  target:
    entity:
      domain: media_player
  fields:
    mode:
      selector:
        select:
          options:
            - bright
            - standard
            - soft
            - user
            - game
            - auto
            - pc
            - movie
            - natural
            - sports
    value:
      selector:
        number:
          min: 0
          max: 99
          mode: box
    source:
      selector:
        number:
          min: 0
          max: 99
          mode: box

set_memc:
  name: Set MEMC
  description: Set the XGIMI MEMC level through the installed Android bridge APK.
  target:
    entity:
      domain: media_player
  fields:
    level:
      selector:
        select:
          options:
            - "off"
            - "low"
            - "middle"
            - "high"
            - "bypass"
    value:
      selector:
        number:
          min: 0
          max: 99
          mode: box
    source:
      selector:
        number:
          min: 0
          max: 99
          mode: box

get_status:
  name: Get status
  description: Ask the Android bridge APK to log the current XGIMI picture mode and MEMC state.
  target:
    entity:
      domain: media_player
  fields:
    source:
      selector:
        number:
          min: 0
          max: 99
          mode: box

get_native_pq_status:
  name: Get native PQ status
  description: Read the native MediaTek PQ status JSON through Android service call.
  target:
    entity:
      domain: media_player

set_native_pq_value:
  name: Set native PQ value
  description: Read the current native MediaTek PQ JSON, change one key, and write the full JSON back.
  target:
    entity:
      domain: media_player
  fields:
    key:
      required: true
      selector:
        text:
    value:
      required: true
      selector:
        text:

get_ext_pq_status:
  name: Get ExtService PQ status
  description: Read MediaTek PQ status through the bridge APK and the OSD-adjacent ExtService path.
  target:
    entity:
      domain: media_player
